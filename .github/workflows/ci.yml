name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: uv venv && uv pip install -e ".[dev]"
      - run: .venv/bin/ruff check .
      - run: .venv/bin/python -m pytest -q
