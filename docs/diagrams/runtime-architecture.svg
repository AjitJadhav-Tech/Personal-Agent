="272.0" text-anchor="middle">Approval Lambda</text><text class="s" x="540.0" y="288.0" text-anchor="middle">web app, approvals,</text><text class="s" x="540.0" y="302.0" text-anchor="middle">LinkedIn sign-in</text><rect class="box" x="450" y="470" width="180" height="64" rx="8"/><text class="t" x="540.0" y="499.0" text-anchor="middle">Runner Lambda</text><text class="s" x="540.0" y="515.0" text-anchor="middle">starts or resumes runs</text><rect class="box" x="700" y="60" width="200" height="64" rx="8"/><text class="t" x="800.0" y="89.0" text-anchor="middle">Amazon Bedrock</text><text class="s" x="800.0" y="105.0" text-anchor="middle">Kimi K3 (Converse API)</text><rect class="box core" x="700" y="332" width="200" height="90" rx="8"/><text class="t" x="800.0" y="360.0" text-anchor="middle">AgentCore Runtime</text><text class="s" x="800.0" y="376.0" text-anchor="middle">LangGraph workflows:</text><text class="s" x="800.0" y="390.0" text-anchor="middle">posts · jobs · opportunities</text><text class="s" x="800.0" y="404.0" text-anchor="middle">daily report</text><rect class="box" x="760" y="484" width="140" height="60" rx="8"/><text class="t" x="830.0" y="511.0" text-anchor="middle">AgentCore Memory</text><text class="s" x="830.0" y="527.0" text-anchor="middle">paused-run checkpoints</text><rect class="box" x="965" y="82" width="200" height="48" rx="8"/><text class="t" x="1065.0" y="103.0" text-anchor="middle">DynamoDB</text><text class="s" x="1065.0" y="119.0" text-anchor="middle">approvals, activity, jobs</text><rect class="box" x="965" y="158" width="200" height="48" rx="8"/><text class="t" x="1065.0" y="179.0" text-anchor="middle">Secrets Manager</text><text class="s" x="1065.0" y="195.0" text-anchor="middle">link key, LinkedIn token</text><rect class="box" x="965" y="234" width="200" height="48" rx="8"/><text class="t" x="1065.0" y="255.0" text-anchor="middle">SSM Parameter Store</text><text class="s" x="1065.0" y="271.0" text-anchor="middle">pause switch</text><r