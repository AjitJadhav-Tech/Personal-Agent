="url(#r-arr)"/><text class="l" x="420" y="494" text-anchor="middle">cron</text><path class="edge hot" d="M630,490 L698,392" marker-end="url(#r-hot)"/><text class="l lh" x="656" y="432" text-anchor="end">invoke</text><path class="edge" d="M800,332 L800,126" marker-end="url(#r-arr)"/><text class="l" x="792" y="200" text-anchor="end">drafts, scores,</text><text class="l" x="792" y="214" text-anchor="end">fact-checks</text><path class="edge" d="M830,422 L830,482" marker-end="url(#r-arr)"/><text class="l" x="838" y="458" text-anchor="start">saves state</text><path class="edge" d="M900,346 L936,346 L936,258 L963,258" marker-end="url(#r-arr)"/><text class="l" x="944" y="316" text-anchor="start">state</text><path class="edge hot" d="M900,366 L963,366" marker-end="url(#r-hot)"/><path class="edge" d="M900,404 L944,404 L944,654" marker-end="url(#r-arr)"/><text class="l" x="952" y="640" text-anchor="start">publish</text><path class="edge" d="M720,422 L720,654" marker-end="url(#r-arr)"/><text class="l" x="712" y="582" text-anchor="end">fetch postings</text><path class="edge" d="M1065,476 L1065,504" marker-end="url(#r-arr)"/><path class="edge hot" d="M1165,360 L1186,360 L1186,14 L95,14 L95,248" marker-end="url(#r-hot)"/><text class="l lh" x="640" y="28" text-anchor="middle">approval requests, apply packs, reply drafts, daily report (via SES)</text></svg>