<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-label="Development and deployment: pushes to GitHub trigger CodePipeline; CodeBuild lints, tests, builds the image and deploys the PersonalAgent stack with CDK."><rect width="100%" height="100%" fill="#f4f6f8"/><style>svg{--x:0}:root,svg{
  --bg:#f4f6f8; --surface:#ffffff; --fg:#17202a; --muted:#5b6672; --line:#c9d1da;
  --accent:#d9570b; --accent-soft:#fdf0e7; --core:#e8f0fa; --core-line:#5b8fd0; --you:#eef6ee; --you-line:#5f9e63;
  --sans:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
}text{font-family:'IBM Plex Sans',Arial,sans-serif}
svg text{font-family:'IBM Plex Sans',Arial,sans-serif}
.box{fill:var(--surface);stroke:var(--line);stroke-width:1.2}
.box.core{fill:var(--core);stroke:var(--core-line)} .box.you{fill:var(--you);stroke:var(--you-line)}
.box.once{fill:var(--surface);stroke:var(--muted);stroke-dasharray:5 4} .box.live{fill:var(--accent-soft);stroke:var(--accent)}
.grp{fill:none;stroke:var(--line);stroke-dasharray:6 5} .region{fill:none;stroke:var(--muted);stroke-width:1.2}
.g{fill:var(--muted);font-size:12px;font-weight:600;letter-spacing:.03em}
.t{fill:var(--fg);font-size:13px;font-weight:600} .s{fill:var(--muted);font-size:11px}
.l{fill:var(--muted);font-size:11px} .lh{fill:var(--accent);font-weight:500}
.edge{fill:none;stroke:var(--muted);stroke-width:1.4} .edge.hot{stroke:var(--accent);stroke-width:1.8} .edge.dash{stroke-dasharray:5 4}
.mk{fill:var(--muted)} .mkh{fill:var(--accent)}
.step{fill:var(--surface);stroke:var(--core-line);stroke-width:1} .st{fill:var(--fg);font-size:12px;font-family:'IBM Plex Mono',Consolas,monospace}
</style><defs><marker id="d-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk" d="M0,0 L10,5 L0,10 z"/></marker><marker id="d-hot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mkh" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="box you" x="20" y="60" width="170" height="64" rx="8"/><text class="t" x="105.0" y="82.0" text-anchor="middle">You in Kiro</text><text class="s" x="105.0" y="98.0" text-anchor="middle">edit · commit</text><text class="s" x="105.0" y="112.0" text-anchor="middle">git push / pull</text><rect class="box you" x="20" y="200" width="170" height="64" rx="8"/><text class="t" x="105.0" y="222.0" text-anchor="middle">Claude</text><text class="s" x="105.0" y="238.0" text-anchor="middle">builds features,</text><text class="s" x="105.0" y="252.0" text-anchor="middle">pushes commits</text><rect class="box" x="250" y="120" width="190" height="80" rx="8"/><text class="t" x="345.0" y="150.0" text-anchor="middle">GitHub repo</text><text class="s" x="345.0" y="166.0" text-anchor="middle">Personal-Agent</text><text class="s" x="345.0" y="180.0" text-anchor="middle">deploy branch</text><rect class="box" x="250" y="290" width="190" height="64" rx="8"/><text class="t" x="345.0" y="319.0" text-anchor="middle">GitHub Actions</text><text class="s" x="345.0" y="335.0" text-anchor="middle">ruff + pytest on push</text><rect class="box" x="500" y="120" width="190" height="80" rx="8"/><text class="t" x="595.0" y="150.0" text-anchor="middle">CodePipeline</text><text class="s" x="595.0" y="166.0" text-anchor="middle">personal-agent</text><text class="s" x="595.0" y="180.0" text-anchor="middle">via CodeStar connection</text><rect class="box once" x="500" y="300" width="190" height="70" rx="8"/><text class="t" x="595.0" y="325.0" text-anchor="middle">Pipeline stack (once)</text><text class="s" x="595.0" y="341.0" text-anchor="middle">pipeline.template.json,</text><text class="s" x="595.0" y="355.0" text-anchor="middle">uploaded in CloudFormation</text><rect class="box core" x="740" y="40" width="240" height="330" rx="8"/><text class="t" x="860" y="66" text-anchor="middle">CodeBuild</text><text class="s" x="860" y="82" text-anchor="middle">ARM · Amazon Linux 2023</text><rect class="step" x="754" y="110" width="212" height="32" rx="6"/><text class="st" x="764" y="131">1  install Python 3.13, CDK</text><rect class="step" x="754" y="152" width="212" height="32" rx="6"/><text class="st" x="764" y="173">2  ruff lint + format check</text><rect class="step" x="754" y="194" width="212" height="32" rx="6"/><text class="st" x="764" y="215">3  pytest (52 tests)</text><rect class="step" x="754" y="236" width="212" height="32" rx="6"/><text class="st" x="764" y="257">4  cdk bootstrap (first run)</text><rect class="step" x="754" y="278" width="212" height="32" rx="6"/><text class="st" x="764" y="299">5  cdk deploy PersonalAgent</text><rect class="step" x="754" y="320" width="212" height="32" rx="6"/><text class="st" x="764" y="341">6  print stack outputs</text><rect class="box" x="1030" y="40" width="160" height="60" rx="8"/><text class="t" x="1110.0" y="67.0" text-anchor="middle">Amazon ECR</text><text class="s" x="1110.0" y="83.0" text-anchor="middle">agent container image</text><rect class="box" x="1030" y="130" width="160" height="60" rx="8"/><text class="t" x="1110.0" y="157.0" text-anchor="middle">S3 asset bucket</text><text class="s" x="1110.0" y="173.0" text-anchor="middle">Lambda code, templates</text><rect class="box" x="1030" y="220" width="160" height="64" rx="8"/><text class="t" x="1110.0" y="242.0" text-anchor="middle">CloudFormation</text><text class="s" x="1110.0" y="258.0" text-anchor="middle">PersonalAgent stack</text><text class="s" x="1110.0" y="272.0" text-anchor="middle">change set</text><rect class="box live" x="1030" y="320" width="160" height="70" rx="8"/><text class="t" x="1110.0" y="345.0" text-anchor="middle">Live services</text><text class="s" x="1110.0" y="361.0" text-anchor="middle">Runtime, Lambdas, API,</text><text class="s" x="1110.0" y="375.0" text-anchor="middle">Cognito, schedules…</text><path class="edge hot" d="M190,92 L248,148" marker-end="url(#d-hot)"/><text class="l lh" x="222" y="108" text-anchor="start">push / pull</text><path class="edge hot" d="M190,232 L248,176" marker-end="url(#d-hot)"/><text class="l lh" x="222" y="222" text-anchor="start">push</text><path class="edge dash" d="M345,200 L345,288" marker-end="url(#d-arr)"/><text class="l" x="353" y="250" text-anchor="start">checks</text><path class="edge hot" d="M440,160 L498,160" marker-end="url(#d-hot)"/><text class="l lh" x="469" y="152" text-anchor="middle">on push</text><path class="edge dash" d="M595,300 L595,202" marker-end="url(#d-arr)"/><text class="l" x="603" y="254" text-anchor="start">creates</text><path class="edge hot" d="M690,160 L738,160" marker-end="url(#d-hot)"/><text class="l lh" x="714" y="152" text-anchor="middle">source</text><path class="edge hot" d="M980,90 L1028,72" marker-end="url(#d-hot)"/><text class="l lh" x="1004" y="70" text-anchor="middle">image</text><path class="edge hot" d="M980,160 L1028,160" marker-end="url(#d-hot)"/><text class="l lh" x="1004" y="152" text-anchor="middle">assets</text><path class="edge hot" d="M980,262 L1028,252" marker-end="url(#d-hot)"/><text class="l lh" x="1004" y="244" text-anchor="middle">deploy</text><path class="edge hot" d="M1110,284 L1110,318" marker-end="url(#d-hot)"/></svg>