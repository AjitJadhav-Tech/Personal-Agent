[project]
name = "personal-agent"
version = "0.1.0"
description = "LangGraph personal agent on Amazon Bedrock AgentCore with human-in-the-loop approvals"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.2",
    "langgraph-checkpoint-aws>=1.2",
    "anthropic[bedrock]>=1.14",
    "bedrock-agentcore>=1.24",
    "boto3>=1.40",
    "pydantic>=2.8",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "aws-cdk-lib>=2.273", "constructs>=10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent", "src/approval_api", "src/runner"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # long lines are inline HTML/CSS templates

[tool.ruff.lint.isort]
combine-as-imports = true
